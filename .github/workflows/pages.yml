name: Publish WortDuell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wortduell-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5

      - name: Prepare release
        run: |
          python3 tools/build.py
          python3 tools/prepare_pwa.py
          node --check js/app.js
          node tools/test_cloud_sync.mjs
          node tools/test_cloud_runtime.mjs
          node tools/test_pwa.mjs
          python3 tools/prepare_pwa.py --output _site

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
